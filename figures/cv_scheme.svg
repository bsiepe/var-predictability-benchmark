<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 352" width="510" height="352">
  <style>
    text    { font-family: 'News Cycle', 'News Gothic MT', 'Arial Narrow', Arial, sans-serif; fill: #222; }
    .train  { fill: #132B69; }  /* data the model is fit on */
    .lag    { fill: #132B69; }  /* last training point = lag-1 predictor; recolour to highlight */
    .target { fill: #D04E00; }  /* one-step-ahead prediction target */
    .unused { fill: #E6E6E6; }  /* not used in this fold */
    .elide  { fill: #132B69; }  /* dots standing in for omitted time points or folds */
    .tick   { font-size: 11.5px; text-anchor: middle; }
    .rowlab { font-size: 13px; text-anchor: end; }
    .endlab { font-size: 12px; text-anchor: start; }
    .legend { font-size: 13px; }
    .panel  { font-size: 14px; font-weight: 700; }
    .title  { font-size: 13px; }
    .note   { font-size: 12px; text-anchor: middle; }
    .axis   { stroke: #222; stroke-width: 1.2; fill: none; }
    .bracket { stroke: #222; stroke-width: 1; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <g id="legend" transform="translate(78,8)">
